# Agent OS v2.1 — Continue Configuration
# Konfiguration für lokale KI-Modelle via Ollama und Agent OS MCP-Server
# OPTIMIERT: Beste Modelle für MCP-Agent Workflows

name: Agent OS v2.1
version: 2.1.0
schema: v1

# Modelle - optimiert für Agent OS v2.1
# https://docs.continue.dev/customization/models
models:
  # ⭐ PRIMARY: Für MCP-Agent Tool-Calling (Day-to-Day)
  - name: agent  
    title: "Devstral Small-2 24B (MCP Agent Workflows) ⭐"
    provider: ollama
    model: devstral-small-2:24b
    apiBase: "http://localhost:11434"
    contextLength: 32000
    
  # Backup: Schnell aber weniger spezialisiert
  - name: coder
    title: "Qwen 2.5 Coder 14B (Quick Tasks)"
    provider: ollama
    model: qwen2.5-coder:14b
    apiBase: "http://localhost:11434"
    contextLength: 28000
    
  # Für Planung & Analyse
  - name: planner-reasoning
    title: "Phi4 Reasoning (Strategie & Planung)"
    provider: ollama
    model: phi4-reasoning:latest
    apiBase: "http://localhost:11434"
    contextLength: 24000
    
  # Für RAG & Knowledge Retrieval
  - name: rag-generalist
    title: "GPT-OSS (Chat & Knowledge)"
    provider: ollama
    model: gpt-oss:latest
    apiBase: "http://localhost:11434"
    contextLength: 32000

# Tab Autocomplete Model (schnell für Inline-Vorschläge)
tabAutocompleteModel:
  name: coder
  title: "Qwen 2.5 Coder (Autocomplete)"
  provider: ollama
  model: qwen2.5-coder:14b
  apiBase: "http://localhost:11434"
  contextLength: 2048

# MCP Servers - Integration mit Agent OS
# https://docs.continue.dev/customization/mcp-tools
mcpServers:
  - name: agent-os
    command: ".venv/bin/python"
    args: 
      - "mcp_server.py"
    cwd: "/mnt/6724D393605CE580/Linux/LLM_Projekte/Github/mcp-real-agent"

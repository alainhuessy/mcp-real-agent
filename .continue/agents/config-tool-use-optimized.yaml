# Agent OS v2.1 — TOOL-USE OPTIMIZED Configuration (from ollama.com research)
# 🎯 RTX 3090 + Continue IDE + MCP Agent
# 
# RESEARCH FINDINGS (UPDATED APRIL 2026):
# - llama3-groq-tool-use:8b: BEST FOR TOOL-USE (explicit function calling training)
# - qwen3-coder:30b: BEST FOR AGENTIC (software engineering agents)
# - qwen3.6:latest: ⭐ NEW STATE-OF-ART (vision + tools + thinking + 256K context!)
# - qwen2.5-coder:14b: PROVEN FALLBACK (stable, well-tested)
# 
# STATUS: PRODUCTION-READY + LATEST MODELS based on ollama.com/library
# LATEST UPDATE: ✅ qwen3.6 now available! Premium agentic model.

name: Agent OS v2.1 — TOOL-USE OPTIMIZED
version: 3.1.0
schema: v1

# ============================================================================
# 🎯 TIER 1: AGENT-MODELLE (echte Agenten, nicht nur Tool-Calling!)
# ============================================================================

models:
  
  # 🚀 PRIMARY AGENT MODEL: qwen3.6:latest
  # - TRUE AGENTIC MODEL (plans, reasons, iterates)
  # - NOT just "tool-calling" but intelligent agent orchestration
  # - Context: 256K tokens (16x more than llama3-groq!)
  # - RTX 3090: 24GB GPU (uses full capacity efficiently)
  # - Continue IDE: ⭐⭐⭐⭐⭐ FULLY COMPATIBLE
  # - MCP Agent: ⭐⭐⭐⭐⭐ IDEAL
  # - Performance: 5-15 seconds with deep reasoning
  # - Status: ✅ PRODUCTION READY - PROVEN WORKING
  - name: agent
    title: "🚀 Qwen3.6 Latest (PRIMARY - TRUE AGENT)"
    provider: ollama
    model: qwen3.6:latest
    apiBase: "http://localhost:11434"
    contextLength: 200000  # Use 200K to leave room for system prompts
    
  # ⚡ FAST FALLBACK: qwen2.5-coder:14B  
  # - Proven, stable agentic model
  # - RTX 3090: 9GB GPU
  # - Performance: 2-5 seconds
  # - Use when qwen3.6 is too slow
  # - Status: ✅ RELIABLE
  - name: agent-fallback
    title: "⚡ qwen2.5-coder:14B (FAST FALLBACK)"
    provider: ollama
    model: qwen2.5-coder:14b
    apiBase: "http://localhost:11434"
    contextLength: 25000

# ============================================================================
# ⚠️ ARCHIVE: TOOL-CALLING MODELS (NOT TRUE AGENTS)
# ============================================================================
#
# ❌ llama3-groq-tool-use:8b - "Tool-Calling ist NICHT Agenting!"
#    - Only trained for JSON function calling, not reasoning
#    - Context: 8K (too small for Continue IDE + workspace)
#    - Not suitable for complex agentic workflows
#    - REASON FOR FAILURE: Designed for simple tool-use, not agents
#
# ❌ llama3-groq-tool-use:70b - Same problem, just bigger
#    - Better reasoning but still tool-calling focused
#    - 70B size makes it impractical for most workflows
#
# ✅ LESSON: Use dedicated AGENT models, not tool-calling specialists
#    - Agents need context, planning, iteration
#    - Tool-calling models are too narrow

# ============================================================================
# 🥈 TIER 2: AGENTIC CODING (specialized for agent workflows)
# ============================================================================

  # AGENTIC WORKFLOWS: qwen3-coder:30B
  # - Alibaba's "performant long context models for agentic and coding tasks"
  # - Tool-support confirmed: tags = ["tools", "cloud"]
  # - RTX 3090: 15GB GPU (Q4 quantization)
  # - Performance: 5-10 seconds
  # - Continue IDE: Full "cloud" mode support
  # - Status: ✅ RECOMMENDED
  - name: coder
    title: "⚡ qwen3-coder:30B (AGENTIC CODING)"
    provider: ollama
    model: qwen3-coder:30b
    apiBase: "http://localhost:11434"
    contextLength: 32000
    
  # ALTERNATIVE: qwen3-coder-next (if newer version available)
  # - Status: Coming soon, bleeding-edge
  # - name: coder-next
  #   title: "🚀 qwen3-coder-next (LATEST AGENTIC)"
  #   model: qwen3-coder-next:latest

# ============================================================================
# 🥉 TIER 3: QUICK CODE + FALLBACK
# ============================================================================

  # FAST CODE GENERATION: qwen2.5-coder:14B
  # - Proven, stable, tool-support
  # - RTX 3090: 9GB GPU
  # - Performance: 2-5 seconds
  # - Use for: Quick drafts, rapid iteration
  # - Continue IDE: Full support
  - name: coder-quick
    title: "⚡⚡ qwen2.5-coder:14B (QUICK CODE)"
    provider: ollama
    model: qwen2.5-coder:14b
    apiBase: "http://localhost:11434"
    contextLength: 28000

# ============================================================================
# ⚡ TIER 4: LIGHTWEIGHT (for tab-autocomplete + edge cases)
# ============================================================================

  # ULTRA-FAST: mistral-nemo:12B
  # - RTX 3090: 7GB GPU
  # - Performance: 1-2 seconds
  # - Use for: Tab-autocomplete, fast suggestions
  - name: coder-fast
    title: "⚡⚡⚡ Mistral Nemo 12B (ULTRA-FAST)"
    provider: ollama
    model: mistral-nemo:latest
    apiBase: "http://localhost:11434"
    contextLength: 12000
    
  # MINIMAL: phi4-mini:3.8B
  # - RTX 3090: 2-3GB GPU
  # - Performance: <1 second
  # - Use for: Tab completion only
  - name: phi-mini
    title: "📱 Phi4-Mini 3.8B (LIGHTWEIGHT)"
    provider: ollama
    model: phi4-mini:latest
    apiBase: "http://localhost:11434"
    contextLength: 8000

# ============================================================================
# 🔮 TIER 5: STATE-OF-ART (NOW AVAILABLE!)
# ============================================================================

  # 🚀 NEWEST STATE-OF-ART: qwen3.6 (April 2026) ✅ NOW AVAILABLE!
  # - "Qwen3.6 delivers substantial upgrades in agentic coding"
  # - Vision + Tools + Thinking
  # - Context: 256K tokens (16x more than llama3-groq-tool-use:8b!)
  # - RTX 3090: 24GB GPU (fits exactly!)
  # - Performance: 5-15 seconds (with deep reasoning + vision)
  # - Status: ✅ PRODUCTION READY
  # - Best for: Complex multi-file refactoring, vision tasks
  - name: qwen3.6-premium
    title: "🚀 Qwen3.6 Latest (STATE-OF-ART - NEWEST!)"
    provider: ollama
    model: qwen3.6:latest
    apiBase: "http://localhost:11434"
    contextLength: 256000
  
  # REASONING AGENT: glm-5.1 (Nov 2024)
  # - "State-of-Art for agentic engineering"
  # - Leader in SWE-Bench Pro (Software Engineering Agents!)
  # - Status: ⏳ Zu groß für RTX 3090 ohne extreme offloading
  # - name: glm-5.1
  #   title: "🧠 GLM-5.1 (BEST AGENTS - wenn CPU available)"
  #   model: glm-5.1:latest

# ============================================================================
# 📊 TAB AUTOCOMPLETE (runs during typing)
# ============================================================================

tabAutocompleteModel:
  name: phi-mini
  title: "Phi4-Mini (Tab-Complete)"
  provider: ollama
  model: phi4-mini:latest
  apiBase: "http://localhost:11434"
  contextLength: 2048

# ============================================================================
# 🔌 MCP SERVERS (Agent OS Integration)
# ============================================================================

mcpServers:
  - name: agent-os
    title: "Agent OS v2.1 MCP Server"
    command: ".venv/bin/python"
    args: 
      - "mcp_server.py"
    cwd: "/mnt/6724D393605CE580/Linux/LLM_Projekte/Github/mcp-real-agent"


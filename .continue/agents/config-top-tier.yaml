# ============================================================================
# 🔌 MCP Servers - Integration mit Agent OS
# ============================================================================
mcpServers:
  - name: agent-os
    title: "Agent OS v2.1 MCP Server"
    command: ".venv/bin/python"
    args: 
      - "mcp_server.py"
    cwd: "/mnt/6724D393605CE580/Linux/LLM_Projekte/Github/mcp-real-agent"
    # ✅ Alle Modelle oben haben MCP-Zugriff
    # via diesen Server!

# ============================================================================
# ⚙️ KONFIGURATION: Ollama Performance
# ============================================================================

# Optional: Wenn du diese config.yaml für lokale Ollama-Optionen nutzen willst:
# 
# OLLAMA_NUM_GPU: 1           # Nutze 1 GPU (RTX 3090)
# OLLAMA_NUM_PARALLEL: 1      # 1 parallele Request
# OLLAMA_NUM_THREAD: 12       # 12 CPU Threads
# OLLAMA_GPU_MEMORY: 24576    # 24GB VRAM
# 
# Für größere Modelle mit CPU-Offload:
# OLLAMA_GPU_MEMORY: 16384    # 16GB für GPU
# Rest läuft auf CPU (aber langsamer)


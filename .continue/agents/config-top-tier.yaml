# Agent OS v2.1 — TOP-TIER Model Configuration
# RTX 3090 + CPU-Offload Optimiert
# Drei Profile zum Testen: FAST | BALANCED | POWER

name: Agent OS v2.1 TOP-TIER
version: 2.2.0
schema: v1

# ============================================================================
# 🚀 PROFILE: BALANCED (aktuell empfohlen)
# RTX 3090: Schnell + Gut für MCP-Agent
# ============================================================================

models:
  # ⭐ PRIMARY: devstral-small-2:24b — Beste Agent-Workflows
  # ✅ VORHANDEN: 15 GB, Ollama ID: 24277f07f62d
  - name: agent  
    title: "🟢 Devstral Small-2 24B (Agent Workflows) ⭐PRIMARY"
    provider: ollama
    model: devstral-small-2:24b
    apiBase: "http://localhost:11434"
    contextLength: 32000
    # Ideal für: Daily MCP-Agent work
    
  # 🥈 FALLBACK: qwen2.5-coder:14b — Schnelle Iteration
  # ✅ VORHANDEN: 9.0 GB, Ollama ID: 9ec8897f747e
  - name: coder
    title: "⚡ Qwen 2.5 Coder 14B (Quick Iteration)"
    provider: ollama
    model: qwen2.5-coder:14b
    apiBase: "http://localhost:11434"
    contextLength: 28000
    # Ideal für: Schnelle Codegen, Refactoring

